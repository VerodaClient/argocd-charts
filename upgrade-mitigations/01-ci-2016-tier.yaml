# CI-2016 mitigation, STEP 1 of 2. Apply this FIRST, on its own.
#
# MUST be a separate apply from 02-ci-2016-policy.yaml. The Calico aggregated
# apiserver validates a tiered policy's "<tier>.<name>" prefix against the
# tiers it currently knows about. If the Tier and the policy go in the same
# kubectl invocation the tier is not yet visible, and the policy is rejected
# with:
#     Incorrectly formatted policy name zz-apiserver-upgrade-guard.apiserver-access
#
# Note this is NOT caught by kubectl apply --dry-run=server, because dry-run
# never persists the Tier and skips the tier lookup. Dry-run passes, real
# apply fails.
#
# Order 99 puts this immediately ahead of allow-tigera (order 100,
# defaultAction Deny). defaultAction Pass means anything this tier does not
# explicitly match falls straight through, so it cannot change the effective
# policy of anything other than the apiserver.
apiVersion: projectcalico.org/v3
kind: Tier
metadata:
  name: zz-apiserver-upgrade-guard
spec:
  order: 99
  defaultAction: Pass
