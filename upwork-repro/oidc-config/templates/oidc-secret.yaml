# Same metadata shape as Upwork's live secret (from Ody's dump).
apiVersion: v1
kind: Secret
metadata:
  name: tigera-oidc-credentials
  namespace: tigera-operator
  labels:
    app.upwork.com/runtime: eks
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  clientID: {{ .Values.oidc.clientId | b64enc }}
  clientSecret: {{ .Values.oidc.clientSecret | b64enc }}
