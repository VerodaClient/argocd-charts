tigera-operator:
  imagePullSecrets: # ideally we should not need this but there could be a bug in the helm-charts
    tigera-pull-secret: unusedvalue
  installation:
    enabled: true
    variant: TigeraSecureEnterprise
    kubernetesProvider: "EKS"
    imagePullSecrets:
      - name: tigera-pull-secret
    kubeletVolumePluginPath: "None"
    typhaDeployment:
      spec:
        template:
          spec:
            containers:
            - name: calico-typha
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
    calicoNodeDaemonSet:
      metadata:
        labels:
          my-label-cn: my-value-cn
      spec:
        template:
          metadata:
            labels:
              my-label-cn-inside: my-value-cn-inside
          spec:
            containers:
            - name: calico-node
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
    calicoKubeControllersDeployment:
      spec:
        template:
          spec:
            containers:
            - name: calico-kube-controllers
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
    csiNodeDriverDaemonSet:
      spec:
        template:
          spec:
            containers:
            - name: calico-csi
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi

  apiServer:
    enabled: true
    apiServerDeployment:
      metadata:
        labels:
          my-label: my-value
      spec:
        template:
          metadata:
            labels:
              my-label-inside: my-value-inside
          spec:
            containers:
            - name: calico-apiserver
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
  compliance:
    complianceBenchmarkerDaemonSet:
      spec:
        template:
          spec:
            containers:
            - name: compliance-benchmarker
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
    complianceControllerDeployment:
      spec:
        template:
          metadata:
            labels:
              my-label-inside: my-value-inside
          spec:
            containers:
            - name: compliance-controller
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
    complianceSnapshotterDeployment:
      spec:
        template:
          spec:
            containers:
            - name: compliance-snapshotter
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
  intrusionDetection:
    intrusionDetectionControllerDeployment:
      spec:
        template:
          spec:
            containers:
            - name: controller
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
      
  logCollector:
    fluentdDaemonSet:
      spec:
        template:
          spec:
            containers:
            - name: fluentd
              resources:
                requests:
                  cpu: 10m
                  memory: 7Mi
  tigera-prometheus-operator:
    enabled: false

  defaultFelixConfiguration:
    enabled: true
    floatingIPs: Disabled
    flowLogsEnableHostEndpoint: true
    healthPort: 9099
    logDebugFilenameRegex: serviceindex|calc_graph
    logSeverityScreen: Debug
    prometheusMetricsEnabled: true
    reportingInterval: 0s
    routeTableRange:
      max: 99
      min: 65

  monitor:
    enabled: true

  manager:
    enabled: false
  logStorage:
    enabled: false

  managementClusterConnection:
    enabled: true
    guardianDeployment:
      spec:
        template:
          spec:
            containers:
            - name: tigera-guardian
              resources:
                requests:
                  cpu: 1000m
                  memory: 1500Mi
                limits:
                  memory: 1500Mi
    managementClusterAddress: leonargomcm.training.tigera.ca:9449
    management:
      tls:
        crt: 
        #crt:  
    managed:
      tls:
        crt: 
        #crt: 
        key: 
        #key: 
