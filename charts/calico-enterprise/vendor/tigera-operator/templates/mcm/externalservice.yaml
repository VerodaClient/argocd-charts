{{ if .Values.managementCluster.service.enabled }}
{{- if .Values.managementCluster.service.createNamespace }}

apiVersion: v1
kind: Namespace
metadata:
  name: calico-system
  annotations:
    # Keep calico-system when createNamespace is later set to false (Helm and Argo CD).
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false

---
{{- end }}

kind: Service
apiVersion: v1
metadata:
  name: calico-manager-mcm
  namespace: calico-system
  annotations:
  {{- range .Values.managementCluster.service.annotations }}
    {{ .key | quote }}: {{ .value | quote }}
  {{- end }}
spec:
  type: {{ .Values.managementCluster.service.type }}
  selector:
    k8s-app: calico-manager
  {{- if eq .Values.managementCluster.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  ports:
    - port: {{ .Values.managementCluster.service.port }}
      targetPort: {{ .Values.managementCluster.service.targetPort }}
      protocol: {{ .Values.managementCluster.service.protocol }}
      {{- if eq .Values.managementCluster.service.type "NodePort" }}
      nodePort: {{ .Values.managementCluster.service.nodePort }}
      {{- end }}

{{ end }}
