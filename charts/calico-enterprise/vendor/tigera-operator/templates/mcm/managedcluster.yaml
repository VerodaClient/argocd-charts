{{ if .Values.managedClusters.enabled }}
{{- range .Values.managedClusters.clusters }}

---

{{- if lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" "managedclusters.projectcalico.org" }}
apiVersion: projectcalico.org/v3
{{- else }}
apiVersion: crd.projectcalico.org/v1
{{- end }}
kind: ManagedCluster
metadata:
  name: {{ .name }}
spec:
  operatorNamespace: {{ $.Release.Namespace }}
  certificate: {{ .certificate }}

{{- end }}
{{ end }}
