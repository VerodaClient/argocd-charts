mgmtclustercert:
  enabled: true
tigera-operator:
  imagePullSecrets: # ideally we should not need this but there could be a bug in the helm-charts
    tigera-pull-secret: unusedvalue
  installation:
    enabled: true
    variant: TigeraSecureEnterprise
    kubernetesProvider: "EKS"
    imagePullSecrets:
      - name: tigera-pull-secret

  defaultFelixConfiguration:
    enabled: true
    floatingIPs: Disabled
    flowLogsEnableHostEndpoint: true
    healthPort: 9099
    logDebugFilenameRegex: serviceindex|calc_graph
    logSeverityScreen: Debug
    prometheusMetricsEnabled: true
    reportingInterval: 0s
    routeTableRange:
      max: 99
      min: 65

#  authentication:
#    enabled: true
#    managerDomain: 'https://calico-mcm-runtime.prod.platform.usw2.upwork'
#    oidc:
#      emailVerification: InsecureSkip
#      groupsClaim: groups
#      issuerURL: 'https://upworkcorp.okta.com'
#      requestedScopes:
#        - openid
#        - groups
#        - email
#        - profile
#      usernameClaim: email

  monitor:
    enabled: true
    externalPrometheus:
      namespace: monitoring
      serviceMonitor:
        labels:
          release: prometheus-stack


  tigera-prometheus-operator:
    enabled: false
#    imagePullSecretReferences:
#      - name: tigera-pull-secret

  managementCluster:
    enabled: true
    address: leonmcm.training.tigera.ca:9449 
    service:
      enabled: true
      annotations:
      - key: service.beta.kubernetes.io/aws-load-balancer-scheme
        value: "internet-facing"
      type: ClusterIP
      port: 9449
      targetPort: 9449
      protocol: TCP

  managedClusters:
    enabled: true
    clusters:
    - name: my-managed-cluster
      operatorNamespace: tigera-operator
#      certificate: 
      certificate: 
