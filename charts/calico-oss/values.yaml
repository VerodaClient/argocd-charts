tigera-operator:
  apiServer:
    enabled: true
    apiServerDeployment:
      spec:
        template:
          spec:
            containers:
              - name: calico-apiserver
                resources:
                  requests:
                    memory: 800Mi
                    cpu: 200m
                  limits:
                    memory: 800Mi

  installation:
    kubernetesProvider: "EKS"
    kubeletVolumePluginPath: "None"
    resources:
      requests:
        cpu: 100m
        memory: 300Mi
      limits:
        memory: 300Mi
