---
apiVersion: v1
kind: List
items:
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: default
    name: default.explicit-deny
  spec:
    egress:
    - action: Allow
      destination: {}
      source: {}
    ingress:
    - action: Allow
      destination: {}
      source: {}
    namespaceSelector: (has(projectcalico.org/name) && projectcalico.org/name not
      in { "kube-system", "calico-system", "tigera-system" })
    order: 1100
    tier: default
    types:
    - Ingress
    - Egress
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: platform
    name: platform.access-to-core-dns
  spec:
    egress:
    - action: Allow
      destination:
        ports:
        - 53
        selector: k8s-app == "kube-dns"
      protocol: UDP
      source: {}
    order: 10
    tier: platform
    types:
    - Egress
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: platform
    name: platform.access-to-zone-infra
  spec:
    ingress:
    - action: Allow
      destination:
        ports:
        - 53
        selector: k8s-app == "kube-dns"
      protocol: UDP
      source:
        namespaceSelector: app.kubernetes.io/zone == "app" || kubernetes.io/metadata.name
          == "calico-system" || kubernetes.io/metadata.name == "tigera-eck-operator"
    - action: Allow
      destination:
        ports:
        - 9443
        selector: app.kubernetes.io/instance == "aws-load-balancer-controller"
      protocol: TCP
      source:
        selector: component == "apiserver"
    - action: Allow
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "ingress-nginx"
        ports:
        - 8443
      protocol: TCP
      source:
        selector: component == "apiserver"
    - action: Allow
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "ingress-nginx"
        ports:
        - 443
        - 80
      protocol: TCP
      source: {}
    - action: Allow
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "prometheus"
        ports:
        - 9090
      protocol: TCP
      source:
        selector: component == "apiserver"
    - action: Allow
      destination:
        namespaceSelector: kubernetes.io/metadata.name == "cert-manager"
        ports:
        - 10250
        - 6443
      protocol: TCP
      source: {}
    namespaceSelector: app.kubernetes.io/zone == "infra" || kubernetes.io/metadata.name
      == "kube-system"
    order: 5
    tier: platform
    types:
    - Ingress
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: platform
    name: platform.pass
  spec:
    egress:
    - action: Pass
      destination: {}
      source: {}
    ingress:
    - action: Pass
      destination: {}
      source: {}
    order: 255
    tier: platform
    types:
    - Egress
    - Ingress
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: platform
    name: platform.zone-infra-isolation
  spec:
    egress:
    - action: Allow
      destination:
        namespaceSelector: app.kubernetes.io/zone == "app"
      source:
        namespaceSelector: kubernetes.io/metadata.name == "prometheus" || kubernetes.io/metadata.name
          == "ingress-nginx"
    - action: Allow
      destination:
        namespaceSelector: app.kubernetes.io/zone == "infra" || kubernetes.io/metadata.name
          == "kube-system"
      source: {}
    ingress:
    - action: Allow
      destination: {}
      source:
        namespaceSelector: app.kubernetes.io/zone == "infra" || kubernetes.io/metadata.name
          == "kube-system"
    namespaceSelector: app.kubernetes.io/zone == "infra" || kubernetes.io/metadata.name
      == "kube-system" || kubernetes.io/metadata.name == "kube-node-lease"
    order: 20
    tier: platform
    types:
    - Ingress
    - Egress
- apiVersion: projectcalico.org/v3
  kind: GlobalNetworkPolicy
  metadata:
    labels:
      app.kubernetes.io/instance: calico-enterprise
      projectcalico.org/tier: security
    name: security.pass
  spec:
    egress:
    - action: Pass
      destination: {}
      source: {}
    ingress:
    - action: Pass
      destination: {}
      source: {}
    order: 255
    tier: security
    types:
    - Egress
    - Ingress

