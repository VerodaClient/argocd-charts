{{ if or (and .Values.mgmtclustercert (eq .Values.mgmtclustercert.enabled true)) (and .Values.standalonecluster (eq .Values.standalonecluster.enabled true))}}

kind: Service
apiVersion: v1
metadata:
  name: tigera-manager-external
  # A Service selector only matches pods in its OWN namespace, so this has to follow
  # the Manager across the 3.23 rehome or the LB silently gets zero endpoints.
  namespace: {{ include "ce.managerNamespace" . }}
spec:
  type: LoadBalancer
  selector:
    k8s-app: {{ include "ce.managerAppLabel" . }}
  externalTrafficPolicy: Local
  ports:
    - port: 9443
      targetPort: 9443
      protocol: TCP

{{ end }}
